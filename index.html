<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miru Coffee - Official Website</title>
  <link rel="stylesheet" href="style-shared.css">
  <link rel="stylesheet" href="style-index.css?v=20260905-3">
</head>
<body>
  <!-- 共用頁首 -->
  <header id="shared-header"></header>

  <main>
    <div class="content">

      <!-- Welcome Hero Section -->
      <section class="card hero-section">
        <div class="hero-flex">
          <div class="hero-text" id="hero-content">
            <!-- Content will be loaded from MSG/002 hero.txt -->
          </div>
          <div class="hero-image">
            <img src="IMG/Equipment/EQ002 Air Roaster.png?v=20260905" alt="Miru Air Roaster" fetchpriority="high">
          </div>
        </div>
      </section>

      <!-- Bean Type Category Section 這裏要加新豆修改 -->
      <section class="card bean-type-section">
        <h2>Explore Our Green Coffee Origins</h2>
        <div class="bean-type-gallery" id="bean-gallery">
          <!-- Active beans are loaded from beans/catalog.json -->
        </div>
      </section>

      <!-- Recent Roasts -->
      <section class="card">
        <h2>Recent Roasts</h2>
        <div class="roast-gallery">
          <img src="IMG/Product/PROD-1.png?v=20260905" alt="Previous" class="coffee-pack expandable-image" loading="lazy">
          <img src="IMG/Product/PROD-2.png?v=20260905" alt="Previous 2nd" class="coffee-pack expandable-image" loading="lazy">
          <img src="IMG/Product/PROD-3.png?v=20260905" alt="Previous 3rd" class="coffee-pack expandable-image" loading="lazy">
          <img src="IMG/Product/PROD-4.png?v=20260905" alt="Previous 4th" class="coffee-pack expandable-image" loading="lazy">
        </div>
      </section>

      <!-- Next Roast -->
      <section class="card">
        <h2>Next Roast Preview</h2>
        <div class="roast-preview">
          <img src="IMG/Product/PROD-0.png?v=20260905" alt="Coming Roast" class="coffee-pack-large expandable-image" loading="lazy">
        </div>
      </section>

    </div>
  </main>

  <!-- 共用頁尾 -->
  <footer id="shared-footer"></footer>

  <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
    <button class="image-lightbox-close" type="button" aria-label="Close enlarged image">&times;</button>
    <img src="" alt="" id="image-lightbox-img">
  </div>

  <!-- Shared Header + Footer Loader -->
  <script>
    const savedScrollY = window.scrollY;
    fetch('shared/header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('shared-header').innerHTML = html;
        return fetch('MSG/001 announcement.txt');
      })
      .then(res => res.text())
      .then(text => {
        const marquee = document.getElementById('announcement-marquee');
        if (marquee) {
          marquee.textContent = text;
          marquee.setAttribute('scrollamount','5');
          marquee.style.fontSize = '20px';
        }
        window.scrollTo(0, savedScrollY);
      });

    fetch('shared/footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('shared-footer').innerHTML = html;
      });
  </script>

  <!-- Hero Text Loader -->
  <script>
    fetch('MSG/002 hero.txt')
      .then(res => res.text())
      .then(html => {
        document.getElementById('hero-content').innerHTML = html;
      });
  </script>

  <script src="js/bean-catalog.js"></script>
  <script>
    window.MIRU_ASSET_VERSION = "20260905";

    MiruBeanCatalog.load()
      .then(MiruBeanCatalog.activeBeans)
      .then((beans) => {
        MiruBeanCatalog.renderGallery(document.getElementById('bean-gallery'), beans);
      })
      .catch(() => {
        document.getElementById('bean-gallery').innerHTML =
          '<p>Unable to load coffee origins right now.</p>';
      });
  </script>

  <script>
    const lightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('image-lightbox-img');
    const closeLightbox = document.querySelector('.image-lightbox-close');

    function hideLightbox() {
      lightbox.classList.remove('is-open');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImg.removeAttribute('src');
      lightboxImg.removeAttribute('alt');
    }

    document.querySelectorAll('.expandable-image').forEach((img) => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.currentSrc || img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
      });
    });

    closeLightbox.addEventListener('click', hideLightbox);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) hideLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
        hideLightbox();
      }
    });
  </script>
</body>
</html>
